name: CI

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify release identity
        run: python scripts/check_release_identity.py

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Check formatting with ruff
        run: ruff format --check src/ tests/

      - name: Type check with mypy
        run: mypy src/abi/ --ignore-missing-imports

      - name: Lint built-in plugin contracts
        if: matrix.python-version == '3.12'
        run: |
          for plugin in metagenomic_plasmid rnaseq_expression wgs_bacteria amplicon_16s metatranscriptomics easymetagenome viral_viwrap wgs_bacannot; do
            abi contract-lint --type "$plugin" --strict
          done

      - name: Run tests
        if: matrix.python-version != '3.12'
        run: |
          python -m pytest tests/ -v --tb=short \
            --strict-markers -m "not requires_tools"

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: |
          pip install pytest-cov
          python -m pytest tests/ -v --tb=short \
            --strict-markers -m "not requires_tools" \
            --cov=src/abi --cov-branch --cov-report=term --cov-report=xml \
            --cov-report=json:coverage.json --cov-fail-under=75
          python scripts/check_module_coverage.py --coverage coverage.json

      - name: Build distribution on Python ${{ matrix.python-version }}
        run: |
          pip install build
          python -m build
          # WP11B: the core wheel is plugin-free; build the official plugin
          # distributions from the same source tree and version.
          python scripts/build_plugin_wheels.py --outdir dist-plugins --build

      - name: Smoke-test wheel on Python ${{ matrix.python-version }}
        run: |
          wheels=(dist/*.whl)
          python -m pip install --force-reinstall "${wheels[0]}[mcp]"
          python -m pip install dist-plugins/abi_agent_plugin_*.whl
          abi_executable="$(command -v abi)"
          wheel_smoke_dir="$(mktemp -d)"
          cd "$wheel_smoke_dir"
          abi list-types
          python "$GITHUB_WORKSPACE/scripts/verify_linux_wheel_capabilities.py" \
            --abi "$abi_executable" \
            --mamba-root "/tmp/abi-ci-python-${{ matrix.python-version }}-root" \
            --architecture "x86_64" \
            --output "/tmp/abi-ci-python-${{ matrix.python-version }}-capabilities.json"

      - name: Acceptance — WP11B installation forms
        if: matrix.python-version == '3.12'
        run: |
          # Core-only, core + single plugin, and core + full official combo
          # are each installed into a fresh venv from the built wheels.
          python scripts/verify_install_forms.py \
            --dist-dir dist \
            --plugin-dist-dir dist-plugins

      - name: Build docs (Sphinx)
        if: matrix.python-version == '3.12'
        run: |
          pip install -e ".[docs]"
          bash docs/build_docs.sh

      - name: Validate Docker Compose configuration
        if: matrix.python-version == '3.12'
        run: docker compose -f docker/docker-compose.yml config --quiet

      - name: Smoke-test wheel (all plugins)
        if: matrix.python-version == '3.12'
        run: |
          wheels=(dist/*.whl)
          python -m pip install --force-reinstall "${wheels[0]}[mcp]"
          python -m pip install dist-plugins/abi_agent_plugin_*.whl
          wheel_smoke_dir="$(mktemp -d)"
          cd "$wheel_smoke_dir"
          abi list-types
          # WP2: the legacy 'autoplasm' entry point is retired; the abi CLI is
          # the only console surface. Verify it is really gone.
          # WP2：旧 'autoplasm' 入口已退役；abi CLI 是唯一命令面。验证其确实不存在。
          if command -v autoplasm >/dev/null 2>&1; then
            echo "legacy autoplasm entry point must not exist" >&2
            exit 1
          fi
          for platform in claude-code opencode codex; do
            abi agent install "$platform" \
              --scope project \
              --project-dir "/tmp/abi-ci-agent-$platform"
            abi agent doctor "$platform" \
              --scope project \
              --project-dir "/tmp/abi-ci-agent-$platform"
          done
          # verify_install_forms.py already exercises all eight plugin dry-runs.
          mkdir -p /tmp/abi-ci-bin
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'if [ "$#" -eq 1 ] && [ "$1" = "--version" ]; then printf "%s\n" "2.1.0"; exit 0; fi' \
            'if [ "${1:-}" != "create" ]; then exit 91; fi' \
            'prefix=""' \
            'spec=""' \
            'while [ "$#" -gt 0 ]; do' \
            '  case "$1" in' \
            '    --prefix) shift; prefix="$1" ;;' \
            '    --file) shift; spec="$1" ;;' \
            '  esac' \
            '  shift' \
            'done' \
            'test -n "$prefix"' \
            'test -f "$spec"' \
            'mkdir -p "$prefix/conda-meta"' \
            ': > "$prefix/conda-meta/history"' \
            > /tmp/abi-ci-bin/micromamba
          chmod +x /tmp/abi-ci-bin/micromamba
          # WP8: env creation is external provisioning; the capability check
          # fabricates the managed-env structure directly.
          # WP8：环境创建属外部准备；能力检查直接伪造受管环境结构。
          abi_env_root="/tmp/abi ci managed root"
          mkdir -p "$abi_env_root/envs/rnaseq/conda-meta"
          : > "$abi_env_root/envs/rnaseq/conda-meta/history"
          spec_path="$abi_env_root/envs/rnaseq"
          test -f "$spec_path/conda-meta/history"

  linux-arm64:
    name: Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-zenhei
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify native architecture
        run: |
          python -c "import platform; assert platform.machine() in {'aarch64', 'arm64'}, platform.machine()"

      - name: Run Linux arm64 tests
        run: |
          python -m pytest tests/ -v --tb=short \
            --strict-markers -m "not requires_tools"

      - name: Build and smoke-test wheel
        run: |
          python -m build
          python scripts/build_plugin_wheels.py --outdir dist-plugins --build
          wheels=(dist/*.whl)
          python -m pip install --force-reinstall "${wheels[0]}[mcp]"
          python -m pip install dist-plugins/abi_agent_plugin_*.whl
          abi_executable="$(command -v abi)"
          wheel_smoke_dir="$(mktemp -d)"
          cd "$wheel_smoke_dir"
          abi list-types
          mkdir -p /tmp/abi-ci-bin
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'if [ "$#" -eq 1 ] && [ "$1" = "--version" ]; then printf "%s\n" "2.1.0"; exit 0; fi' \
            'if [ "${1:-}" != "create" ]; then exit 91; fi' \
            'prefix=""' \
            'spec=""' \
            'while [ "$#" -gt 0 ]; do' \
            '  case "$1" in' \
            '    --prefix) shift; prefix="$1" ;;' \
            '    --file) shift; spec="$1" ;;' \
            '  esac' \
            '  shift' \
            'done' \
            'test -n "$prefix"' \
            'test -f "$spec"' \
            'mkdir -p "$prefix/conda-meta"' \
            ': > "$prefix/conda-meta/history"' \
            > /tmp/abi-ci-bin/micromamba
          chmod +x /tmp/abi-ci-bin/micromamba
          abi_env_root="/tmp/abi ci arm managed root"
          mkdir -p "$abi_env_root/envs/rnaseq/conda-meta"
          : > "$abi_env_root/envs/rnaseq/conda-meta/history"
          spec_path="$abi_env_root/envs/rnaseq"
          test -f "$spec_path/conda-meta/history"
          python "$GITHUB_WORKSPACE/scripts/verify_linux_wheel_capabilities.py" \
            --abi "$abi_executable" \
            --mamba-root "/tmp/abi ci arm managed root" \
            --architecture "aarch64" \
            --output /tmp/abi-ci-arm-capabilities.json
          abi-mcp --help

  migration-gate:
    name: Migration Gate
    runs-on: ubuntu-latest
    needs: [test, linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migration gate
        run: python scripts/migration_gate.py


  deploy-docs:
    name: Deploy docs to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build Sphinx docs
        run: bash docs/build_docs.sh

      - name: Create .nojekyll
        run: touch docs/_build/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
