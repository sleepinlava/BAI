name: Publish to PyPI

"on":
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing verified GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish verified release distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/abi-agent/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download distributions attached to this GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "${REQUESTED_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.whl" --pattern "*.tar.gz" \
            --pattern "release-artifacts.json" --dir dist

      - name: Verify downloaded release identity and hashes
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python scripts/verify_release_artifacts.py --dist-dir dist --tag "${REQUESTED_TAG}"
          mv dist/release-artifacts.json release-artifacts.json

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine packaging
          python -m twine check dist/*

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
