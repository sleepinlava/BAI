name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  quality-gate:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/ci.yml

  release:
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,docs]"

      - name: Verify tag and package identity
        run: python scripts/check_release_identity.py --tag "${GITHUB_REF_NAME}"

      - name: Build package
        run: python -m build

      - name: Build official plugin distributions
        run: python scripts/build_plugin_wheels.py --outdir dist-plugins --build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Bind exact release distributions to a SHA-256 manifest
        run: |
          python scripts/verify_release_artifacts.py \
            --dist-dir dist --tag "${GITHUB_REF_NAME}" --write-manifest

      - name: Verify supported installation forms
        run: |
          python scripts/verify_install_forms.py \
            --dist-dir dist \
            --plugin-dist-dir dist-plugins

      - name: Verify wheel contents
        run: |
          python -m venv /tmp/abi-wheel-smoke
          wheels=(dist/*.whl)
          /tmp/abi-wheel-smoke/bin/pip install "${wheels[0]}[mcp]"
          /tmp/abi-wheel-smoke/bin/pip install dist-plugins/*.whl
          export PATH="/tmp/abi-wheel-smoke/bin:$PATH"
          /tmp/abi-wheel-smoke/bin/python -c "import abi; from importlib.metadata import version; assert abi.__version__ == version('abi-agent')"
          wheel_smoke_dir="$(mktemp -d)"
          cd "$wheel_smoke_dir"
          /tmp/abi-wheel-smoke/bin/abi list-types
          for platform in claude-code opencode codex; do
            /tmp/abi-wheel-smoke/bin/abi agent install "$platform" \
              --scope project \
              --project-dir "/tmp/abi-release-agent-$platform"
            /tmp/abi-wheel-smoke/bin/abi agent doctor "$platform" \
              --scope project \
              --project-dir "/tmp/abi-release-agent-$platform"
          done
          # All eight plugin dry-runs use the isolated fixtures in verify_install_forms.py.
          capability_report="$GITHUB_WORKSPACE/dist/abi-linux-capability-${GITHUB_REF_NAME}.json"
          /tmp/abi-wheel-smoke/bin/python \
            "$GITHUB_WORKSPACE/scripts/verify_linux_wheel_capabilities.py" \
            --abi /tmp/abi-wheel-smoke/bin/abi \
            --mamba-root /tmp/abi-release-managed-root \
            --architecture x86_64 \
            --output "$capability_report"

      - name: Create verified GitHub Release draft
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # A release.published event emitted with GITHUB_TOKEN does not start
          # another workflow. Publish this verified draft with an authenticated
          # maintainer identity to trigger the existing Trusted Publisher.
          draft: true
