name: Docker

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin to build"
        type: choice
        options:
          - all
          - amplicon
          - rnaseq
          - wgs
          - metatranscriptomics
          - plasmid
        default: "all"
        required: false
      push:
        description: "Push after local smoke test (v* tag ref only)"
        type: boolean
        default: false
        required: false
      push_to_dockerhub:
        description: "Also push to Docker Hub (requires DOCKERHUB_TOKEN secret)"
        type: boolean
        default: false
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # GHCR push
      attestations: write   # provenance + SBOM
      id-token: write       # keyless signing
    strategy:
      fail-fast: false
      matrix:
        include:
          - plugin: amplicon
            dockerfile: docker/Dockerfile.amplicon
            image-name: abi-amplicon
          - plugin: rnaseq
            dockerfile: docker/Dockerfile.rnaseq
            image-name: abi-rnaseq
          - plugin: wgs
            dockerfile: docker/Dockerfile.wgs
            image-name: abi-wgs
          - plugin: metatranscriptomics
            dockerfile: docker/Dockerfile.metatranscriptomics
            image-name: abi-metatranscriptomics
          # metagenomic_plasmid is ~15 GB; select it explicitly when needed.
          - plugin: plasmid
            dockerfile: docker/Dockerfile.metagenomic_plasmid
            image-name: abi-plasmid

    steps:
      - uses: actions/checkout@v4

      # ── Gate: filter matrix entries ───────────────────────────────
      # Step-level `if` CAN access `matrix.*` (unlike job-level `if`).
      # The workflow is manual-only; build only the requested plugin(s).
      - name: Gate
        id: gate
        if: inputs.plugin == 'all' || inputs.plugin == matrix.plugin
        run: echo "Building ${{ matrix.plugin }}"

      - name: Set up Docker Buildx
        if: steps.gate.outcome == 'success'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest

      # ── Determine push behaviour ──────────────────────────────────
      - name: Determine push flags
        if: steps.gate.outcome == 'success'
        id: flags
        run: |
          PUSH=false
          PUSH_TO_DH=false

          # Publishing is also opt-in during a manual dispatch.
          if [[ "${{ inputs.push }}" == "true" ]]; then
            if [[ "${{ github.ref }}" != refs/tags/v* ]]; then
              echo "Publishing requires a manually selected v* tag ref." >&2
              exit 1
            fi
            PUSH=true
            if [[ "${{ inputs.push_to_dockerhub }}" == "true" ]]; then
              PUSH_TO_DH=true
            fi
          fi

          echo "push=${PUSH}" >> $GITHUB_OUTPUT
          echo "push_to_dh=${PUSH_TO_DH}" >> $GITHUB_OUTPUT

      # ── Validate locally before any registry publication ─────────
      - name: Build validation image
        if: steps.gate.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ matrix.image-name }}:latest
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Smoke-test validation image
        if: steps.gate.outcome == 'success'
        run: |
          docker run --rm ${{ matrix.image-name }}:latest list-types
          echo "=== Image ${{ matrix.image-name }} local smoke-test OK ==="

      # ── Registry logins ───────────────────────────────────────────
      - name: Login to GitHub Container Registry
        if: steps.gate.outcome == 'success' && steps.flags.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.gate.outcome == 'success' && steps.flags.outputs.push_to_dh == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Tag / label generation ────────────────────────────────────
      - name: Docker metadata (GHCR)
        id: meta-ghcr
        if: steps.gate.outcome == 'success' && steps.flags.outputs.push == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=ABI ${{ matrix.plugin }}
            org.opencontainers.image.description=ABI bioinformatics plugin: ${{ matrix.plugin }}
            org.opencontainers.image.vendor=sleepinlava

      - name: Docker metadata (Docker Hub)
        id: meta-dh
        if: steps.gate.outcome == 'success' && steps.flags.outputs.push_to_dh == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.image-name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.ref_name }}

      # ── Merge GHCR + Docker Hub tags / labels ─────────────────────
      - name: Merge image tags
        id: meta
        if: steps.gate.outcome == 'success' && steps.flags.outputs.push == 'true'
        run: |
          TAGS="${{ steps.meta-ghcr.outputs.tags }}"
          LABELS="${{ steps.meta-ghcr.outputs.labels }}"
          if [ -n "${{ steps.meta-dh.outputs.tags }}" ]; then
            TAGS="${TAGS}"$'\n'"${{ steps.meta-dh.outputs.tags }}"
          fi
          echo 'tags<<EOF_TAGS' >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo 'EOF_TAGS' >> $GITHUB_OUTPUT
          echo 'labels<<EOF_LABELS' >> $GITHUB_OUTPUT
          echo "$LABELS" >> $GITHUB_OUTPUT
          echo 'EOF_LABELS' >> $GITHUB_OUTPUT

      # ── Publish only after the local smoke test succeeds ──────────
      - name: Build and push registry image
        if: steps.gate.outcome == 'success' && steps.flags.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # RNA-seq's R/DESeq2 environment is not yet arm64-ready under QEMU.
          platforms: ${{ matrix.plugin != 'rnaseq' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # ── Verify the published registry image ───────────────────────
      - name: Smoke-test (pushed image)
        if: steps.gate.outcome == 'success' && steps.flags.outputs.push == 'true'
        run: |
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/${{ matrix.image-name }}:latest"
          IMAGE_REF=$(echo "$IMAGE_REF" | tr '[:upper:]' '[:lower:]')
          docker pull "$IMAGE_REF"
          docker run --rm "$IMAGE_REF" list-types
          echo "=== Image ${{ matrix.image-name }} push smoke-test OK ==="
