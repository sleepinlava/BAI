limitations:
  - id: illumina_only
    severity: important
    statement: The first certified input scope is Illumina paired-end bacterial isolates only.
    mitigation: Use wgs_bacteria or wait for validated long-read and hybrid compatibility entries.
  - id: production_certification_pending
    severity: critical
    statement: D2/D3 biological, resume, HPC, and strict runtime-lock certification is not yet complete.
    mitigation: Treat runs as engineering validation until the production acceptance record is published.
  - id: pinned_upstream
    severity: important
    statement: Only Bacannot v3.4.4 commit a78ddb0bffe75139adf1f443260d6d5b1987fe27 is supported.
    mitigation: Upgrade through a new compatibility and contract-set entry; never use a moving branch.
