# Known limitations for the metatranscriptomics plugin.
# See: docs/next_development_plan.md §6.5

limitations:
  - "RNA abundance does not equal protein activity; post-transcriptional regulation, protein turnover, and post-translational modification all modulate the proteome independently of transcript levels. (Ref: Buccitelli & Selbach, Nat Rev Genet, 2020, doi:10.1038/s41576-020-0258-4; Vogel & Marcotte, Nat Rev Genet, 2012, doi:10.1038/nrg3185)"
  - "Relative expression levels are affected by sequencing depth, rRNA removal efficiency, and database version; results are valid only for the specific experimental conditions and database versions recorded in the resource manifest. (Ref: Zhang et al., Annu Rev Biomed Data Sci, 2021, doi:10.1146/annurev-biodatasci-031121-103035; Shakya et al., Front Genet, 2019, doi:10.3389/fgene.2019.00904)"
  - "Incomplete host RNA removal contaminates functional profiles with host transcripts; host contamination rate is reported but residual host reads may still confound low-abundance pathway detection. (Ref: Carrilero et al., Gut Microbes, 2024, doi:10.1080/19490976.2024.2323235; Tan et al., BMC Microbiol, 2023, doi:10.1186/s12866-023-03037-y)"
  - "HUMAnN stratified results (taxon-contributed pathway abundances) depend on the accuracy of both taxonomic profiling (MetaPhlAn) and functional assignment; misclassification at either step propagates to stratified outputs. (Ref: Franzosa et al., Nat Methods, 2018, doi:10.1038/s41592-018-0176-y; Beghini et al., eLife, 2021, doi:10.7554/eLife.65088)"
  - "Reference databases (MetaPhlAn marker genes, UniRef, MetaCyc) are biased toward well-characterized organisms and pathways; novel or poorly studied microbial functions may be absent. (Ref: Suzek et al., Bioinformatics, 2007, doi:10.1093/bioinformatics/btm098; Caspi et al., Nucleic Acids Res, 2018, doi:10.1093/nar/gkx935; Albright & Louca, Sci Data, 2023, doi:10.1038/s41597-023-01994-7)"
  - "Do not equate relative pathway expression with absolute functional activity; enzyme kinetics, substrate availability, and cellular context all determine actual metabolic flux. (Ref: Sinha et al., BMC Bioinformatics, 2021, doi:10.1186/s12859-021-04488-8; Fendt et al., Mol Syst Biol, 2010, doi:10.1038/msb.2010.11)"
  - "Metatranscriptomic data captures a snapshot of community transcriptional activity at sampling time; temporal dynamics, circadian rhythms, and transient responses are not captured in a single sample. (Ref: Martínez Arbas et al., Front Genet, 2021, doi:10.3389/fgene.2021.666244; Lyu et al., Genes, 2024, doi:10.3390/genes15010051)"
