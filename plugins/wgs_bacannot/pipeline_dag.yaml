abi_version: "0.1"
pipeline_id: wgs_bacannot
pipeline_name: Managed Bacannot External Workflow
platforms: [illumina]
category_dirs:
  external_workflow: raw/bacannot
standard_tables:
  qc_summary: {description: Read and assembly quality summary}
  genome_assembly_stats: {description: Assembly metrics}
  genome_annotation: {description: Genome annotation summary}
  mlst_profile: {description: MLST profile}
  amr_profile: {description: AMR profile}
  sample_status: {description: Per-sample contract status}
nodes:
  bacannot_workflow:
    tool_id: bacannot
    category: external_workflow
    scope: cross_sample
    platforms: [illumina]
    optional: false
    depends_on: []
    inputs:
      sample_sheet: {type: file, source: config.input.sample_sheet}
      bacannot_db: {type: directory, source: config.resources.bacannot_db}
    outputs:
      output_dir:
        type: directory
        path: "{outdir}/{category_dir}"
        contract:
          contains: [pipeline_info]
          min_files: 1
    assertions:
      - "output_files.output_dir exists"
