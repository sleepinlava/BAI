contract_id: bacannot_assembly
contract_version: bacannot-3.4.4-v1
process_class: assembly
enabled_when: modules.assembly == true
process_patterns: ["(?:^|:)UNICYCLER$", "(?:^|:)FLYE$"]
cardinality: {per_sample: {min_successful: 1, max_successful_final: 1}}
accepted_statuses: [COMPLETED, CACHED]
required_outputs:
  - role: assembly_fasta
    min_files: 1
    validators: [non_empty, fasta_parseable, contains_sequence]
publish: true
