project_name: wgs_bacannot_run
mode: auto
threads: 16
outdir: results/wgs_bacannot
log_dir: results/wgs_bacannot/logs

workflow:
  source: fmalmeida/bacannot
  revision: v3.4.4
  commit_sha: a78ddb0bffe75139adf1f443260d6d5b1987fe27
  profile: docker
  resume: false

input:
  sample_sheet: sample_sheet.tsv
  platform: illumina
  mode: paired_end

modules:
  assembly: true
  annotation: true
  mlst: true
  amr: true

resources:
  runtime_resource_root: ABI_RUNTIME_RESOURCE_ROOT_NOT_CONFIGURED
  bacannot_db: BACANNOT_DB_NOT_CONFIGURED
  database_snapshot_id: ""
  database_sha256: ""
  max_cpus: 16
  max_memory: 64.GB
  max_time: 24.h

audit:
  level: task_contracts
  retain_success_command_evidence: true
