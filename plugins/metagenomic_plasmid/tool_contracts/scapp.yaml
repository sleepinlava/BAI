abi_version: '0.1'
tool_id: scapp
name: SCAPP
category: plasmid_detection
purpose: Plasmid detection from the SPAdes assembly graph using SCAPP confident cycles.
when_to_use:
- assembly_graph_available
- paired_end_reads_available
- plasmid_reconstruction_required
inputs:
  assembly_graph:
    type: file
    format: fastg
    required: true
  read1:
    type: file
    format: fastq.gz
    required: true
  read2:
    type: file
    format: fastq.gz
    required: true
  max_k:
    type: integer
    minimum: 1
  threads:
    type: integer
    minimum: 1
outputs:
  scapp_predictions:
    type: file
    format: fasta
execution:
  executable: scapp
  command_template: scapp -g {assembly_graph} -o {output_dir} -k 77 -p {threads} -r1 {read1} -r2 {read2}
  network: false
  writes_output: true
failure_handling:
  missing_input:
    hint: Check the SPAdes FASTG assembly graph and paired-end read paths.
  tool_not_found:
    hint: Install SCAPP in the autoplasm-scapp environment.
  nonzero_exit:
    hint: Inspect SCAPP stderr log in provenance/step_logs.
resources:
  cpu: 4
  memory: 4GB
  walltime: "01:00:00"
