tools:
- id: dorado
  name: Dorado
  category: basecalling
  default_enabled: false
  required: false
  limitations: ONT POD5 basecalling is opt-in and records the Dorado version in provenance.
- id: samtools_fastq
  name: samtools fastq
  category: basecalling
  default_enabled: false
  required: false
- id: fastp
  name: fastp
  category: qc
  default_enabled: true
  required: true
  outputs:
  - clean_reads
  - html
  - json
  limitations: Short-read Illumina QC only.
- id: fastqc
  name: FastQC
  category: qc
  default_enabled: false
  required: false
- id: multiqc
  name: MultiQC
  category: qc
  default_enabled: true
  required: false
- id: nanoplot
  name: NanoPlot
  category: qc
  default_enabled: true
  required: false
- id: filtlong
  name: Filtlong
  category: qc
  default_enabled: true
  required: false
- id: hifiadapterfilt
  name: HiFiAdapterFilt
  category: qc
  default_enabled: true
  required: false
- id: megahit
  name: MEGAHIT
  category: assembly
  default_enabled: true
  required: true
  output_dir_policy: must_not_exist
- id: metaspades
  name: metaSPAdes
  category: assembly
  default_enabled: false
  required: false
- id: metaflye
  name: metaFlye
  category: assembly
  default_enabled: true
  required: true
- id: hifiasm_meta
  name: hifiasm
  category: assembly
  default_enabled: true
  required: false
  limitations: hifiasm-meta is not resolvable from the configured channels under the
    required python=3.9 environments; this registry entry uses hifiasm as the installable
    fallback.
- id: opera_ms
  name: OPERA-MS
  category: assembly
  default_enabled: false
  required: false
  limitations: OPERA-MS is no longer available from current bioconda channels; install
    OPERA-MS.pl manually and enable this optional hybrid assembler only when available.
- id: quast
  name: metaQUAST
  category: assembly_qc
  default_enabled: true
  required: false
- id: medaka
  name: Medaka
  category: polishing
  default_enabled: false
  required: false
  limitations: ONT-only consensus polishing; opt in after metaFlye assembly.
- id: genomad
  name: geNomad
  category: plasmid_detection
  default_enabled: true
  required: true
- id: plasme
  name: PLASMe
  category: plasmid_detection
  script_path: '{autoplasm_root}/PLASMe/PLASMe.py'
  default_enabled: false
  required: false
- id: plasx
  name: PlasX
  category: plasmid_detection
  extra_path_dirs:
  - '{resource_root}/PlasX'
  default_enabled: false
  required: false
- id: plasmidfinder
  name: PlasmidFinder
  category: typing
  default_enabled: false
  required: false
- id: plasmaag
  name: PlasMAAG
  category: plasmid_binning
  default_enabled: false
  required: false
  limitations: Runs through the dedicated repository-local autoplasm-plasmaag Python
    3.11 environment; first real run may initialize the geNomad database.
- id: gplas2
  name: gplas2
  category: plasmid_binning
  default_enabled: false
  required: false
- id: mob_typer
  name: MOB-typer
  category: typing
  default_enabled: false
  required: false
- id: copla
  name: COPLA
  category: typing
  default_enabled: false
  required: false
- id: plasmidhostfinder
  name: PlasmidHostFinder
  category: host_prediction
  default_enabled: false
  required: false
- id: prodigal
  name: Prodigal
  category: annotation
  default_enabled: false
  required: false
- id: bakta
  name: Bakta
  category: annotation
  default_enabled: true
  required: false
- id: abricate
  name: ABRicate
  category: annotation
  default_enabled: false
  required: false
- id: amrfinderplus
  name: AMRFinderPlus
  category: annotation
  default_enabled: true
  required: false
- id: mob_suite
  name: MOB-suite
  category: annotation
  default_enabled: false
  required: false
- id: isescan
  name: ISEScan
  category: annotation
  default_enabled: false
  required: false
  limitations: ISEScan is optional and may be absent from cloud conda channels; enable
    it only after installing isescan.py into the annotation environment.
- id: integronfinder
  name: IntegronFinder
  category: annotation
  default_enabled: true
  required: false
  limitations: Requires the dedicated autoplasm-integronfinder compatibility environment
    with biopython=1.77 because IntegronFinder 2.0rc6 imports the removed Bio.Seq.IUPAC
    API.
- id: bowtie2_host_removal
  name: Bowtie2 host removal
  category: host_removal
  default_enabled: false
  required: false
- id: minimap2_host_removal
  name: minimap2 host removal
  category: host_removal
  default_enabled: false
  required: false
- id: bowtie2
  name: bowtie2
  category: abundance
  default_enabled: true
  required: true
- id: minimap2
  name: minimap2
  category: abundance
  default_enabled: true
  required: true
- id: samtools
  name: samtools
  category: abundance
  default_enabled: true
  required: true
- id: coverm
  name: CoverM
  category: abundance
  default_enabled: true
  required: false
- id: kraken2
  name: Kraken2
  category: host_prediction
  default_enabled: false
  required: false
- id: metaphlan
  name: MetaPhlAn
  category: host_prediction
  default_enabled: false
  required: false
- id: fastspar
  name: FastSpar
  category: network
  default_enabled: false
  required: false
- id: deseq2_plasmid
  name: DESeq2 plasmid differential abundance
  category: statistics
  default_enabled: false
  required: false
- id: blast
  name: BLAST+
  category: comparative_genomics
  default_enabled: false
  required: false
- id: mmseqs2
  name: MMseqs2
  category: comparative_genomics
  default_enabled: false
  required: false
- id: mummer
  name: MUMmer/nucmer
  category: comparative_genomics
  default_enabled: false
  required: false
  limitations: Requires a reference plasmid set; optional comparative step.
- id: clinker
  name: clinker
  category: comparative_genomics
  default_enabled: false
  required: false
  limitations: Requires annotated GenBank files.
- id: report_markdown
  name: AutoPlasm Markdown report
  category: report
  default_enabled: true
  required: false
- id: metabat2
  name: MetaBAT2
  category: mag_host_genomes
  default_enabled: false
  required: false
- id: checkm2
  name: CheckM2
  category: mag_host_genomes
  default_enabled: false
  required: false
- id: gtdbtk
  name: GTDB-Tk
  category: mag_host_genomes
  default_enabled: false
  required: false
- id: minced
  name: MinCED
  category: host_plasmid_linking
  default_enabled: false
  required: false
- id: pycirclize
  name: pyCirclize
  category: visualization
  default_enabled: false
  required: false
  limitations: Requires pycirclize Python package; uses adapter script for integration.
- id: pyvis
  name: pyvis
  category: visualization
  default_enabled: false
  required: false
  limitations: Requires pyvis Python package; uses adapter script for integration.
- id: platon
  name: Platon
  category: plasmid_detection
  extra_path_dirs:
  - '{resource_root}/platon/bin'
  - '{resource_root}/platon'
  default_enabled: false
  required: false
- id: scapp
  name: SCAPP
  category: plasmid_detection
  default_enabled: false
  required: false
  limitations: Requires a metaSPAdes assembly graph (fastg) and the original paired-end
    reads for BWA alignment.
- id: recycler
  name: Recycler
  category: plasmid_binning
  script_path: '{autoplasm_root}/Recycler/bin/recycle.py'
  default_enabled: false
  required: false
  limitations: Requires plasmid candidate FASTA + assembly graph + BAM.
- id: conjscan
  name: CONJscan
  category: typing
  extra_path_dirs:
  - '{resource_root}/macsyfinder/bin'
  - '{resource_root}/macsyfinder'
  default_enabled: false
  required: false
  limitations: Requires MacSyFinder + CONJscan module; detects conjugative systems.
- id: macsyfinder
  name: MacSyFinder
  category: typing
  extra_path_dirs:
  - '{resource_root}/macsyfinder/bin'
  - '{resource_root}/macsyfinder'
  default_enabled: false
  required: false
- id: rgi
  name: RGI/CARD
  category: annotation
  default_enabled: false
  required: false
  limitations: Requires CARD database; RGI = Resistance Gene Identifier.
- id: eggnog_mapper
  name: eggNOG-mapper
  category: annotation
  default_enabled: false
  required: false
  limitations: Requires eggNOG database download; functional annotation.
- id: concoct
  name: CONCOCT
  category: mag_host_genomes
  default_enabled: false
  required: false
- id: semibin
  name: SemiBin
  category: mag_host_genomes
  default_enabled: false
  required: false
- id: das_tool
  name: DAS Tool
  category: mag_host_genomes
  default_enabled: false
  required: false
  limitations: Meta-binner aggregator; requires upstream bins from MetaBAT2 and CONCOCT.
- id: hybridspades
  name: hybridSPAdes
  category: assembly
  default_enabled: false
  required: false
  limitations: SPAdes hybrid mode for short + long read co-assembly.
- id: dna_features_viewer
  name: dna-features-viewer
  category: visualization
  default_enabled: false
  required: false
  limitations: Requires dna_features_viewer + biopython Python packages.
