tools:
- id: seqkit
  name: SeqKit
  category: input_validation
  version_command: seqkit version
  version_regex: seqkit v?([^\s]+)
  required: true
  resources:
    cpu: 1
    memory: 1GB
    walltime: 00:30:00
- id: fastp
  name: fastp
  category: preprocessing
  version_command: fastp --version
  version_regex: fastp ([^\s]+)
  required: true
  resources:
    cpu: 4
    memory: 8GB
    walltime: 02:00:00
    disk: 20GB
- id: kneaddata
  name: KneadData
  category: host_removal
  version_command: kneaddata --version
  version_regex: kneaddata v?([^\s]+)
  required: true
  resources:
    cpu: 4
    memory: 16GB
    walltime: 08:00:00
    disk: 40GB
- id: kraken2
  name: Kraken2
  category: taxonomy
  version_command: kraken2 --version
  version_regex: Kraken version ([^\s]+)
  required: true
  resources:
    cpu: 4
    memory: 32GB
    walltime: 08:00:00
    disk: 20GB
- id: bracken
  name: Bracken
  category: taxonomy
  version_command: bracken -v
  version_regex: Bracken v?([^\s]+)
  required: true
  resources:
    cpu: 1
    memory: 8GB
    walltime: 02:00:00
- id: bowtie2
  name: Bowtie2 (KneadData dependency)
  category: host_removal_dependency
  env_name: easymeta-p0
  version_command: bowtie2 --version
  version_regex: version ([^\s]+)
  required: true
  provenance_only: true
  resources:
    cpu: 1
    memory: 1GB
    walltime: 00:05:00
- id: trimmomatic
  name: Trimmomatic (KneadData dependency)
  category: host_removal_dependency
  env_name: easymeta-p0
  version_command: trimmomatic -version
  version_regex: ^([^\s]+)
  required: true
  provenance_only: true
  resources:
    cpu: 1
    memory: 1GB
    walltime: 00:05:00
- id: humann4
  name: HUMAnN 4
  category: functional
  required: true
  resources:
    cpu: 16
