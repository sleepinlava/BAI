# Known limitations for the easymetagenome plugin.
# Reviewed and updated 2026-07-27 against the AutoDL cloud deployment audit
# (see 'abi paper writing/云端资源与工具注册核查表.md', gaps G2/G3/G4/G9).
# These are rendered into every report to prevent over-interpretation.

limitations:
  - "Read-based taxonomic profiling (Kraken2/Bracken) estimates relative abundance only; it does not measure absolute microbial load or cell viability. (Ref: Gloor et al., Front Microbiol 2017, https://doi.org/10.3389/fmicb.2017.02224; Wood et al., Genome Biol 2019, https://doi.org/10.1186/s13059-019-1891-0)"
  - "Classification sensitivity depends on reference database completeness and version; organisms absent from the database cannot be detected, and closely related genomes may be misassigned. (Ref: Wood et al., Genome Biol 2019, https://doi.org/10.1186/s13059-019-1891-0)"
  - "Bracken abundance re-estimation assumes a uniform read-length distribution and can be biased for genomes sharing many k-mers or containing large repeats. (Ref: Lu et al., PeerJ Comput Sci 2017, https://doi.org/10.7717/peerj-cs.104)"
  - "Host removal with KneadData depends on the host reference database; divergent or unassembled host regions may survive filtering and contaminate downstream profiles. (Ref: KneadData official documentation, https://github.com/biobakery/kneaddata)"
  - "HUMAnN4 functional profiles cover only genes and pathways represented in the UniRef/ChocoPhlAn databases; uncharacterized gene families are invisible to this analysis. (Ref: Beghini et al., eLife 2021, https://doi.org/10.7554/eLife.65088)"
  - "Stratified functional assignments link pathways to taxa only through database annotations; low-coverage organisms yield noisy or missing stratifications. (Ref: Beghini et al., eLife 2021, https://doi.org/10.7554/eLife.65088)"
  - "Dry-run results prove only structural validity (planning, command rendering, provenance); biological conclusions require real tool outputs with validated inputs."
  - "Cloud Kraken2 database is k2_standard_20260226 (frozen 2026-07-27), not the k2_pluspf_20240605 snapshot used by the reference study; the standard snapshot lacks the protozoa/fungi genomes present in pluspf, so eukaryotic gut taxa may be under-detected or misassigned. Endpoint E5 (genus-level rank-consistency vs the reference study's Supplementary Table S3) is therefore degraded to directional/order consistency rather than strict pre-registered thresholds. (Ref: cloud audit cloud_audit_20260727_phaseB/D logs; gap G2)"
  - "KneadData host-filtering index is the original official Homo_sapiens_Bowtie2_v0.1 (Ensembl GRCh37, 85 sequences, built 2015-06-12; tarball SHA-256 28bd91e3...3f801f frozen); unlike the reference study's hg37dec index it contains no decoy sequences and uses Ensembl chromosome naming, so host-removal stringency may differ slightly. (Ref: cloud audit 2026-07-27, gap G3)"
  - "HUMAnN is pinned to v3.9 (channel maximum as of 2026-07-27; humann>=4 is currently unsatisfiable on bioconda/PyPI), paired with ChocoPhlAn v201901_v31, UniRef90 201901b_full and MetaPhlAn mpa_vJan25_CHOCOPhlAnSGB_202503; functional-profile differences relative to HUMAnN4-based studies are expected and version-tagged in provenance. (Ref: cloud audit 2026-07-27, gaps G4/G9)"
