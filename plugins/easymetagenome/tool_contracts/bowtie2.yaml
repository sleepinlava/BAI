abi_version: "0.1"
tool_id: bowtie2
name: Bowtie2 (KneadData dependency)
category: host_removal_dependency
purpose: Capture the actual Bowtie2 version invoked by KneadData.
when_to_use: [host_decontamination]
inputs: {}
outputs: {}
execution:
  executable: bowtie2
  command_template: bowtie2 --version
  network: false
  writes_output: false
normalization: {tables: []}
failure_handling:
  tool_not_found: {hint: Install Bowtie2 in easymeta-p0.}
resources: {cpu: 1, memory: 1GB, walltime: "00:05:00"}
