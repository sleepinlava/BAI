abi_version: "0.1"
tool_id: rnaseq_enrichment
name: Offline RNA-seq Enrichment
category: enrichment
purpose: Add GTF gene symbols and run offline GO/Reactome ORA and preranked GSEA.
when_to_use:
  - differential_expression_available
  - offline_pathway_enrichment_requested
inputs:
  de_results:
    type: file
    formats: [tsv]
    required: true
  annotation_gtf:
    type: file
    formats: [gtf]
    required: true
  go_obo:
    type: file
    formats: [obo]
    required: true
  go_gaf:
    type: file
    formats: [gaf.gz]
    required: true
  reactome_gmt:
    type: file
    formats: [gmt]
    required: true
  enrichment_script:
    type: file
    formats: [py]
    required: true
outputs:
  output_dir:
    type: directory
  annotated_de:
    type: file
    format: tsv
  go_ora:
    type: file
    format: tsv
  reactome_ora:
    type: file
    format: tsv
  go_gsea:
    type: file
    format: tsv
  reactome_gsea:
    type: file
    format: tsv
  go_ora_plot:
    type: file
    format: tsv
  reactome_ora_plot:
    type: file
    format: tsv
  go_gsea_plot:
    type: file
    format: tsv
  reactome_gsea_plot:
    type: file
    format: tsv
  enrichment_manifest:
    type: file
    format: json
execution:
  executable: python
  command_template: >-
    python {enrichment_script} --de-results {de_results}
    --annotation-gtf {annotation_gtf} --go-obo {go_obo} --go-gaf {go_gaf}
    --reactome-gmt {reactome_gmt} --output-dir {output_dir}
    --annotation-release {annotation_release}
    --alpha {alpha} --rank-column {rank_column} --permutations {permutations}
    --seed {seed} --min-size {min_size} --max-size {max_size}
    --top-n {top_n} --threads {threads}
  network: false
  writes_output: true
failure_handling:
  missing_input:
    hint: Configure GRCh37.75 GTF, GO OBO/GAF, and Reactome GMT local paths.
  tool_not_found:
    hint: Install the locked rnaseq environment containing gseapy 1.3.0.
  execution_error:
    hint: Check gene identifiers, GTF gene_name attributes, and enrichment resources.
resources:
  cpu: 4
  memory: 8GB
  walltime: "02:00:00"
