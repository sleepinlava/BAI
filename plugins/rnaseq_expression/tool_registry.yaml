tools:
- id: fastp
  name: fastp
  category: qc
  executable: fastp
  default_enabled: true
  required: true
  command_template: fastp -i {read1} -I {read2} -o {output_dir}/{sample_id}_R1.clean.fastq.gz
    -O {output_dir}/{sample_id}_R2.clean.fastq.gz --thread {threads} --html {output_dir}/{sample_id}.fastp.html
    --json {output_dir}/{sample_id}.fastp.json
  inputs:
  - read1
  - read2
- id: star
  name: STAR
  category: alignment
  executable: STAR
  default_enabled: true
  required: true
  command_template: STAR --runThreadN {threads} --genomeDir {genome_index} --readFilesIn
    {read1} {read2} --readFilesCommand zcat --outSAMtype BAM SortedByCoordinate --outFileNamePrefix
    {output_prefix}
  inputs:
  - read1
  - read2
  - genome_index
- id: featurecounts
  name: featureCounts
  category: expression
  executable: featureCounts
  default_enabled: true
  required: true
  command_template: >-
    sh -c 'tmp="$3.stderr.tmp"; if featureCounts -T "$1" -p --countReadPairs -a "$2" -o "$3" "$4" 2>"$tmp"; then cat "$tmp" >&2; rm -f "$tmp"; exit 0; fi; rc=$?; if grep -q "No paired-end reads were detected" "$tmp"; then cat "$tmp" >&2; echo "ABI: retrying featureCounts without -p because BAM has no paired-end flags" >&2; rm -f "$tmp"; featureCounts -T "$1" -a "$2" -o "$3" "$4"; else cat "$tmp" >&2; rm -f "$tmp"; exit "$rc"; fi' featurecounts {threads} {annotation_gtf} {counts} {bam}
  inputs:
  - bam
  - annotation_gtf
- id: build_count_matrix
  name: Build Count Matrix
  category: preprocessing
  executable: python
  default_enabled: true
  required: true
  command_template: python {count_matrix_script} --expression-dir {expression_dir}
    --sample-sheet {sample_sheet} --output-dir {output_dir}
  inputs:
  - expression_dir
  - sample_sheet
  - count_matrix_script
- id: deseq2
  name: DESeq2
  category: differential_expression
  executable: Rscript
  default_enabled: true
  required: true
  command_template: Rscript {deseq2_script} --counts {count_matrix} --metadata {sample_metadata}
    --output {output_dir} --comparison {comparison} --design "{design}" --alpha {alpha}
  inputs:
  - count_matrix
  - sample_metadata
  - deseq2_script

- id: rnaseq_enrichment
  name: Offline RNA-seq Enrichment
  category: enrichment
  executable: python
  default_enabled: false
  required: false
  command_template: >-
    python {enrichment_script} --de-results {de_results}
    --annotation-gtf {annotation_gtf} --go-obo {go_obo} --go-gaf {go_gaf}
    --reactome-gmt {reactome_gmt} --output-dir {output_dir}
    --annotation-release {annotation_release}
    --alpha {alpha} --rank-column {rank_column} --permutations {permutations}
    --seed {seed} --min-size {min_size} --max-size {max_size}
    --top-n {top_n} --threads {threads}
  inputs:
  - de_results
  - annotation_gtf
  - go_obo
  - go_gaf
  - reactome_gmt
  - enrichment_script
