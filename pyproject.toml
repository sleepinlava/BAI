# ── Build system ──────────────────────────────────────────────────────
# hatchling >=1.21.0 fixes a bug where the "dependencies" field was
# incorrectly validated as a URL under [project.urls] during editable
# installs. Hatchling 1.32 defaults to Core Metadata 2.5, which Twine 6.2
# cannot validate yet, so keep release artifacts on Metadata 2.4.
[build-system]
requires = ["hatchling>=1.21.0,<1.32"]
build-backend = "hatchling.build"

[project]
name = "abi-agent"
version = "1.7.0"
description = "Agent-Bioinformatics Interface: plugin-based abstraction for AI-driven bioinformatics analysis"
readme = "README.md"
license = { text = "MIT" }
license-files = []
requires-python = ">=3.10"
authors = [{ name = "BingkangGuo", email = "bingkangguo@gmail.com" }]
keywords = ["bioinformatics", "agent", "ai", "pipeline", "plasmid", "metagenomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/sleepinlava/BAI"
Repository = "https://github.com/sleepinlava/BAI"

[project.optional-dependencies]
mcp = [
    "mcp>=2.0,<3; python_version >= '3.10'",
]
plugins = [
    "abi-agent-plugin-amplicon-16s",
    "abi-agent-plugin-easymetagenome",
    "abi-agent-plugin-metagenomic-plasmid",
    "abi-agent-plugin-metatranscriptomics",
    "abi-agent-plugin-rnaseq-expression",
    "abi-agent-plugin-viral-viwrap",
    "abi-agent-plugin-wgs-bacteria",
    "abi-agent-plugin-wgs-bacannot",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.0",
    "myst-parser>=3.0",
    "roman>=4.1",
]
dev = [
    "numpy>=1.21",
    "pandas>=1.5",
    "scipy>=1.9",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
abi = "abi.cli:main"
abi-mcp = "abi.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/abi"]
# WP11B: plugin implementations and their co-located data ship in the
# per-plugin distributions (abi-agent-plugin-<id>); the core wheel stays
# plugin-free while keeping the abi.plugins compatibility shim.
exclude = [
    "src/abi/plugins/amplicon_16s",
    "src/abi/plugins/easymetagenome",
    "src/abi/plugins/metagenomic_plasmid",
    "src/abi/plugins/metatranscriptomics",
    "src/abi/plugins/rnaseq_expression",
    "src/abi/plugins/viral_viwrap",
    "src/abi/plugins/wgs_bacteria",
    "src/abi/plugins/wgs_bacannot",
]

# Built-in plugin templates live outside src/ so editable installs and source-tree
# usage can share the same files. Include them in wheels at the same relative
# path expected by abi.config.PLUGIN_ROOT.
[tool.hatch.build.targets.wheel.force-include]
"config" = "config"
"environments.yaml" = "abi/data/environments.yaml"
"integrations" = "abi/integrations"

[tool.hatch.build.targets.sdist]
include = [
    "CMakeLists.txt",
    "cmake",
    "config",
    "data/examples",
    "docs",
    "envs",
    "environments.yaml",
    "golden_traces",
    "integrations",
    "src/abi",
    "plugins",
    "scripts",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "demo_artifacts",
    "baseline_comparison",
    "figures",
]

# Hatch treats directories named ``envs`` as virtual-environment artifacts by
# default. These are tracked Conda specifications required by the packaged
# workflow, so force them into the sdist as well as the wheel.
[tool.hatch.build.targets.sdist.force-include]
"envs" = "envs"
"examples/wgs_bacannot/demo_R1.fastq" = "examples/wgs_bacannot/demo_R1.fastq"
"examples/wgs_bacannot/demo_R2.fastq" = "examples/wgs_bacannot/demo_R2.fastq"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: end-to-end smoke tests that execute real bioinformatics tools (may be slow)",
    "requires_tools: tests that require conda environments with tools installed",
    "performance: deterministic core performance and memory regression baselines",
]

[tool.coverage.run]
omit = [
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
exclude = ["*.R"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped", "no-any-return"]
exclude = ["/(?:opt|usr)/(?:hostedtoolcache/)?[^/]*/.*site-packages/"]
