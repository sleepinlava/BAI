<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABI Documentation</title>
<style>
  :root {
    --bg: #f4f7fb;
    --card: #ffffff;
    --text: #16213a;
    --muted: #5a6a7e;
    --brand: #1e6fba;
    --brand-dark: #155a8a;
    --brand-soft: #e8f4fd;
    --border: #d9e2ec;
    --code-bg: #16213a;
    --code-text: #d7e3f2;
    --shadow: 0 12px 40px rgba(20, 40, 80, 0.10), 0 2px 8px rgba(20, 40, 80, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --card: #171e2e;
      --text: #e6edf7;
      --muted: #9db0c7;
      --brand: #5ba4e6;
      --brand-dark: #7db8e8;
      --brand-soft: #1a2d42;
      --border: #2a3648;
      --code-bg: #0b101c;
      --code-text: #c8ddf0;
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.45), 0 2px 8px rgba(0, 0, 0, 0.30);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(60rem 30rem at 85% -10%, rgba(30, 111, 186, 0.10), transparent 60%),
      radial-gradient(50rem 28rem at -10% 110%, rgba(30, 111, 186, 0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    padding: 2rem 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 3rem 3.5rem;
    max-width: 540px;
    width: 100%;
    text-align: center;
  }
  .card img.logo { width: 68px; height: 68px; margin-bottom: 0.5rem; }
  .card h1 { font-size: 1.85rem; font-weight: 700; margin: 0.5rem 0 0.2rem; letter-spacing: -0.02em; }
  .card p.sub { color: var(--muted); font-size: 1rem; margin-bottom: 1.75rem; }
  .card p.choose { margin: 0; color: var(--muted); font-size: 0.95rem; }
  .language-options { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1.25rem; }
  .language-options a {
    display: block; padding: 0.85rem 1rem; border-radius: 10px;
    background: var(--brand); color: #fff; font-weight: 650; text-decoration: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .language-options a.secondary { background: var(--brand-soft); color: var(--brand-dark); }
  .language-options a:hover, .language-options a:focus-visible {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(30, 111, 186, 0.28);
  }
  .task-links { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; margin-top: 1.5rem; text-align: left; }
  .task-links a {
    padding: 0.65rem 0.75rem; border: 1px solid var(--border); border-radius: 8px;
    color: var(--brand-dark); text-decoration: none; font-size: 0.9rem;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }
  .task-links a:hover, .task-links a:focus-visible {
    border-color: var(--brand);
    background: var(--brand-soft);
    transform: translateY(-1px);
  }
  .quick-start {
    margin-top: 1.5rem; padding: 0.9rem 1rem; border-radius: 10px;
    background: var(--code-bg); color: var(--code-text);
    font: 0.8rem/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
    text-align: left;
  }
  .quick-start .prompt { color: var(--brand); font-weight: 700; user-select: none; }
  .links { margin-top: 1.75rem; font-size: 0.88rem; color: var(--muted); }
  .links a { color: var(--brand); text-decoration: none; margin: 0 0.6rem; }
  .links a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
  .badges { margin-top: 1.5rem; }
  .badges img { margin: 0 0.25rem; border-radius: 3px; }
  @media (max-width: 560px) {
    .card { padding: 2rem 1.5rem; }
    .language-options, .task-links { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="card">
  <picture>
    <source srcset="_static/logo-dark.png" media="(prefers-color-scheme: dark)">
    <img class="logo" src="_static/logo-light.png" alt="ABI logo" onerror="this.style.display='none'">
  </picture>
  <h1>ABI Documentation</h1>
  <p class="sub">Agent-Bioinformatics Interface</p>
  <p class="choose">Choose your documentation language</p>
  <div class="language-options" aria-label="Documentation language">
    <a href="en/" lang="en">English</a>
    <a href="zh/" lang="zh-CN" class="secondary">中文</a>
  </div>
  <nav class="task-links" aria-label="Documentation tasks">
    <a href="en/index.html#quick-start">Run an analysis</a>
    <a href="en/agent_usage.html">Connect an Agent</a>
    <a href="en/plugin_development_guide.html">Develop a plugin</a>
    <a href="en/runtime_locks.html">Deploy and operate</a>
  </nav>
  <div class="quick-start" aria-label="Three-step quick start">
    <span class="prompt">$</span> pip install abi-agent<br>
    <span class="prompt">$</span> abi list-types<br>
    <span class="prompt">$</span> abi plan --type &lt;analysis_type&gt; --output-json
  </div>
  <div class="badges">
    <img src="https://img.shields.io/pypi/v/abi-agent?style=flat-square&color=1e6fba" alt="PyPI">
    <img src="https://img.shields.io/pypi/pyversions/abi-agent?style=flat-square" alt="Python">
    <img src="https://img.shields.io/github/actions/workflow/status/sleepinlava/BAI/ci.yml?branch=master&style=flat-square" alt="CI">
  </div>
  <div class="links">
    <a href="https://github.com/sleepinlava/BAI">GitHub</a>
    <a href="https://pypi.org/project/abi-agent/">PyPI</a>
  </div>
</div>
</body>
</html>
