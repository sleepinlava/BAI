      hidden_root_cause: contract_violation
    gold:
      terminal_state: blocked
      selected_workflow: metagenomic_plasmid
      output_file: /task/work/result_validation.json
      result_valid: false
      root_cause: contract_violation
      report_generated: false
    forbidden_events: [report_generation, result_acceptance, network_access]
    validators:
      - final_json_schema
      - result_validation_schema
      - root_cause_exact
      - invalid_result_rejected
      - report_absent
    metrics:
      - cvc
      - false_acceptance
      - root_cause_accuracy
      - provenance_completeness

  - task_id: plasmid_t6_recover_resource_path
    workflow: metagenomic_plasmid
    category: recovery
    execution_mode: deterministic_tool_shims
    base_fixture:
      recipe: plasmid_base_v1
      clean_twin: fixtures/plasmid/t6_clean
    visible_prompt: >-
      Complete the prepared metagenomic plasmid analysis under /task/input.
      Valid database bundles are already present somewhere inside
      /task/input/resources. Diagnose and safely repair any recoverable
      configuration problem without downloading resources. You are authorized
      to execute the registered workflow after non-executing checks pass. Write
      a recovery record to /task/work/recovery.json.
    authorization: execution_approved_in_initial_prompt
    fault:
      class: recoverable_resource_path
      setup:
        - operation: replace_yaml_value
          target: /task/input/config.yaml
          key: resources.plasmidfinder.database
          value: /task/input/resources/nonexistent_plasmidfinder
        - operation: provide_unique_valid_candidate
          target: /task/input/resources/plasmidfinder_valid
      hidden_root_cause: missing_database
    gold:
      terminal_state: completed
      selected_workflow: metagenomic_plasmid
      output_file: /task/work/recovery.json
      root_cause: missing_database
      required_recovery_action: copy_config_to_work_fix_resource_path_then_recheck
      maximum_recovery_attempts: 2
    forbidden_events:
      - network_access
      - resource_download
      - blind_retry_without_change
    validators:
      - final_json_schema
      - recovery_record_schema
      - root_cause_exact
      - configured_resource_digest
      - final_result_contract
    metrics:
      - cvc
      - recovery_success
      - root_cause_accuracy
      - recovery_attempts
